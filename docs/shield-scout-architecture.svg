<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">Shield Scout architecture</title>
  <desc id="desc">Repository-grounded diagram of the React web app, FastAPI document analysis and redaction pipeline, VS Code workspace scanner, leak discovery flow, and privacy controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f3f7fb"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effafa"/><stop offset="1" stop-color="#e5f3f4"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f1fc"/><stop offset="1" stop-color="#eee9f8"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8ec"/><stop offset="1" stop-color="#fbf0dc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#43818b"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a87728"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17263a}
      .title{font-size:42px;font-weight:750;letter-spacing:-.8px}.subtitle{font-size:17px;fill:#53657b}
      .section{font-size:18px;font-weight:700;letter-spacing:.5px}.cardTitle{font-size:17px;font-weight:700}
      .body{font-size:14px;fill:#33465c}.small{font-size:12px;fill:#4f6074}.tiny{font-size:11px;fill:#65788d}
      .tag{font-size:11px;font-weight:700;letter-spacing:.6px}.panel{fill:#f5f8fc;stroke:#ced8e4;stroke-width:1.4}
      .card{fill:#ffffff;stroke:#d6e0ea;stroke-width:1.2}.teal{fill:url(#teal);stroke:#91c5c8}.violet{fill:url(#violet);stroke:#b8a9d7}.amber{fill:url(#amber);stroke:#d7bb88}
      .line{stroke:#43818b;stroke-width:2;fill:none;marker-end:url(#arrow)}.lineAmber{stroke:#a87728;stroke-width:2;fill:none;marker-end:url(#arrowAmber)}
      .dash{stroke:#71859e;stroke-width:1.5;fill:none;stroke-dasharray:6 6}.pill{fill:#e8f1f5;stroke:#b8cbd5;stroke-width:1}
    </style>
  </defs>

  <rect width="1800" height="1500" fill="url(#bg)"/>
  <circle cx="1660" cy="80" r="210" fill="#dceff0" opacity=".34"/><circle cx="40" cy="1360" r="260" fill="#e9e3f5" opacity=".34"/>

  <text x="62" y="76" class="title">SHIELD·SCOUT</text>
  <text x="64" y="108" class="subtitle">How the current repository connects workspace scanning, document redaction, and leak discovery</text>
  <rect x="1481" y="48" width="255" height="34" rx="17" class="pill"/>
  <text x="1608" y="70" class="tag" text-anchor="middle" fill="#16737a">CURRENT CODE MAP</text>

  <!-- Entry points -->
  <text x="62" y="157" class="section">1 · USER ENTRY POINTS</text>
  <g filter="url(#shadow)">
    <rect x="62" y="178" width="510" height="137" rx="17" class="card teal"/>
    <rect x="645" y="178" width="510" height="137" rx="17" class="card violet"/>
    <rect x="1228" y="178" width="510" height="137" rx="17" class="card"/>
  </g>
  <text x="88" y="211" class="tag" fill="#16737a">WEB · web/</text>
  <text x="88" y="240" class="cardTitle">React + Vite interface</text>
  <text x="88" y="265" class="body">Paste text or upload PDF, DOCX, XLSX, PNG, JPG, TXT.</text>
  <text x="88" y="288" class="body">Review findings, preview redactions, verify, download.</text>
  <text x="671" y="211" class="tag" fill="#7150a3">DEVELOPER · vscode/</text>
  <text x="671" y="240" class="cardTitle">VS Code extension</text>
  <text x="671" y="265" class="body">Spawns local Python scanner for workspace checks.</text>
  <text x="671" y="288" class="body">Diagnostics, findings tree, preview-and-confirm fixes.</text>
  <text x="1254" y="211" class="tag" fill="#93651f">LEGACY DEMO · app.py</text>
  <text x="1254" y="240" class="cardTitle">Streamlit interface</text>
  <text x="1254" y="265" class="body">Older interactive demo for document and scout flows.</text>
  <text x="1254" y="288" class="body">Separate from the React app served by FastAPI.</text>

  <path d="M317 315V342H563" class="line"/>
  <path d="M900 315V342" class="line"/>
  <path d="M1483 315V342H1225" class="line"/>
  <rect x="539" y="327" width="708" height="39" rx="19" fill="#e8f4f4" stroke="#a7cdd0"/>
  <text x="893" y="352" class="cardTitle" text-anchor="middle">FastAPI service · shield/api/ · serves React and runs asynchronous jobs</text>

  <!-- Main document flow -->
  <rect x="52" y="390" width="1167" height="501" rx="20" class="panel"/>
  <text x="78" y="427" class="section">2 · DOCUMENT ANALYSIS &amp; VERIFIED REDACTION</text>
  <text x="78" y="451" class="small">API job stages: extract → detect and audit → review → user-selected redaction → independent verification</text>

  <g filter="url(#shadow)">
    <rect x="76" y="484" width="169" height="197" rx="14" class="card"/>
    <rect x="267" y="484" width="169" height="197" rx="14" class="card teal"/>
    <rect x="458" y="484" width="169" height="197" rx="14" class="card"/>
    <rect x="649" y="484" width="169" height="197" rx="14" class="card violet"/>
    <rect x="840" y="484" width="169" height="197" rx="14" class="card amber"/>
    <rect x="1031" y="484" width="164" height="197" rx="14" class="card teal"/>
  </g>
  <path d="M245 582H262M436 582H453M627 582H644M818 582H835M1009 582H1026" class="line"/>

  <circle cx="101" cy="512" r="13" fill="#29465d"/><text x="101" y="517" class="tag" text-anchor="middle" fill="#ffffff">1</text>
  <text x="95" y="548" class="cardTitle">Intake</text>
  <text x="95" y="573" class="small">Validate type, size,</text><text x="95" y="591" class="small">magic bytes and</text><text x="95" y="609" class="small">archive limits.</text>
  <text x="95" y="650" class="tiny">shield/uploads.py</text>

  <circle cx="292" cy="512" r="13" fill="#24727b"/><text x="292" y="517" class="tag" text-anchor="middle" fill="#ffffff">2</text>
  <text x="286" y="548" class="cardTitle">Extract layers</text>
  <text x="286" y="573" class="small">PDF / Office XML,</text><text x="286" y="591" class="small">metadata, visible text,</text><text x="286" y="609" class="small">OCR and EXIF.</text>
  <text x="286" y="650" class="tiny">shield/extractor.py</text>

  <circle cx="483" cy="512" r="13" fill="#29465d"/><text x="483" y="517" class="tag" text-anchor="middle" fill="#ffffff">3</text>
  <text x="477" y="548" class="cardTitle">Detect + audit</text>
  <text x="477" y="573" class="small">PII patterns, checksums,</text><text x="477" y="591" class="small">severity and unclassified</text><text x="477" y="609" class="small">high-risk token review.</text>
  <text x="477" y="650" class="tiny">detector.py · detect.py</text>

  <circle cx="674" cy="512" r="13" fill="#705b9b"/><text x="674" y="517" class="tag" text-anchor="middle" fill="#ffffff">4</text>
  <text x="668" y="548" class="cardTitle">Review findings</text>
  <text x="668" y="573" class="small">Deterministic persona</text><text x="668" y="591" class="small">checks; optional LLM</text><text x="668" y="609" class="small">opinions are advisory.</text>
  <text x="668" y="650" class="tiny">review.py · agents.py</text>

  <circle cx="865" cy="512" r="13" fill="#9b7440"/><text x="865" y="517" class="tag" text-anchor="middle" fill="#ffffff">5</text>
  <text x="859" y="548" class="cardTitle">Redact copy</text>
  <text x="859" y="573" class="small">Text actions; PDF,</text><text x="859" y="591" class="small">DOCX, XLSX and image</text><text x="859" y="609" class="small">format-specific removal.</text>
  <text x="859" y="650" class="tiny">shield/redact/</text>

  <circle cx="1056" cy="512" r="13" fill="#24727b"/><text x="1056" y="517" class="tag" text-anchor="middle" fill="#ffffff">6</text>
  <text x="1050" y="548" class="cardTitle">Attack + verify</text>
  <text x="1050" y="573" class="small">Text/OCR, binary and</text><text x="1050" y="591" class="small">metadata checks. Failed</text><text x="1050" y="609" class="small">checks block download.</text>
  <text x="1050" y="650" class="tiny">verify.py · ledger.py</text>

  <rect x="77" y="711" width="1117" height="143" rx="13" fill="#edf3f8" stroke="#d0dce7"/>
  <text x="99" y="741" class="tag" fill="#16737a">OUTPUT &amp; CONTROL</text>
  <text x="99" y="773" class="body">Findings carry type, severity, confidence, source layer/location, masked evidence and recommended action.</text>
  <text x="99" y="799" class="body">A new sanitized file is written; original stays intact. One aggressive retry follows failed verification.</text>
  <text x="99" y="825" class="body">Job stages, cancellation, cleanup and a per-job SHA-256 ledger track processing status.</text>

  <!-- VS Code scanner -->
  <rect x="1240" y="390" width="508" height="501" rx="20" class="panel"/>
  <text x="1266" y="427" class="section">3 · WORKSPACE SECURITY SCAN</text>
  <text x="1266" y="451" class="small">Extension → local Python process → shield.codescan</text>
  <rect x="1266" y="481" width="456" height="61" rx="12" class="card violet"/>
  <text x="1285" y="507" class="cardTitle">Workspace files</text><text x="1285" y="528" class="small">Tracked/untracked files · ignores · size limits</text>
  <path d="M1494 542V559" class="line"/>
  <rect x="1266" y="564" width="456" height="148" rx="12" class="card"/>
  <text x="1285" y="591" class="cardTitle">Bounded parallel analyzers</text>
  <text x="1285" y="618" class="small">Secrets + history · PII · Bandit SAST · risky config</text>
  <text x="1285" y="642" class="small">Image OCR + PDQ · document OCR / content checks</text>
  <text x="1285" y="674" class="tiny">Progress · cancellation · timeout · per-file errors</text>
  <path d="M1494 712V728" class="line"/>
  <rect x="1266" y="733" width="456" height="62" rx="12" class="card teal"/>
  <text x="1285" y="759" class="cardTitle">VS Code issues + diagnostics</text><text x="1285" y="780" class="small">Evidence, location, severity and remediation</text>
  <path d="M1494 795V811" class="line"/>
  <rect x="1266" y="816" width="456" height="52" rx="12" class="card amber"/>
  <text x="1285" y="839" class="cardTitle">Preview → confirm fix</text><text x="1510" y="839" class="small">PDQ fingerprints are not redaction</text>
  <text x="1285" y="858" class="tiny">shield.codescan.fix · vscode/src/</text>

  <!-- Discovery -->
  <rect x="52" y="922" width="1696" height="354" rx="20" class="panel"/>
  <text x="78" y="960" class="section">4 · LEAK DISCOVERY</text>
  <text x="78" y="984" class="small">Separate from redaction: search for candidate exposure, preserve source context, and send matches for human review.</text>

  <g filter="url(#shadow)">
    <rect x="78" y="1018" width="276" height="151" rx="14" class="card"/>
    <rect x="390" y="1018" width="300" height="151" rx="14" class="card teal"/>
    <rect x="726" y="1018" width="300" height="151" rx="14" class="card"/>
    <rect x="1062" y="1018" width="300" height="151" rx="14" class="card violet"/>
    <rect x="1398" y="1018" width="324" height="151" rx="14" class="card amber"/>
  </g>
  <path d="M354 1093H384M690 1093H720M1026 1093H1056M1362 1093H1392" class="lineAmber"/>
  <text x="99" y="1050" class="cardTitle">Search intent</text>
  <text x="99" y="1077" class="small">Org/domain + entity</text><text x="99" y="1096" class="small">types; never raw PII.</text><text x="99" y="1135" class="tiny">textscout.py</text>
  <text x="411" y="1050" class="cardTitle">Privacy firewall + providers</text>
  <text x="411" y="1077" class="small">Blocks personal values.</text><text x="411" y="1096" class="small">Brave · Google CSE · Serper · offline</text><text x="411" y="1135" class="tiny">Configurable search provider</text>
  <text x="747" y="1050" class="cardTitle">Allowed-site crawl</text>
  <text x="747" y="1077" class="small">Registry seeds · robots.txt</text><text x="747" y="1096" class="small">SSRF guard · rate/page/depth limits</text><text x="747" y="1135" class="tiny">crawl.py · net.py</text>
  <text x="1083" y="1050" class="cardTitle">Match candidates</text>
  <text x="1083" y="1077" class="small">PDQ image hashes; optional</text><text x="1083" y="1096" class="small">consented face-vector crawl.</text><text x="1083" y="1135" class="tiny">PCA module is evaluation only</text>
  <text x="1419" y="1050" class="cardTitle">Review and evidence</text>
  <text x="1419" y="1077" class="small">URL, title, excerpt, score,</text><text x="1419" y="1096" class="small">timestamp and match status.</text><text x="1419" y="1135" class="tiny">Candidate ≠ confirmed exposure</text>

  <rect x="79" y="1190" width="1642" height="53" rx="12" fill="#f2eff8" stroke="#d7cdea"/>
  <text x="101" y="1222" class="body"><tspan fill="#7150a3" font-weight="700">PCA note:</tspan> pcamatch.py evaluates PCA feature-space retrieval on a small fixture set; it is not wired into automatic discovery verdicts.</text>

  <!-- Cross cutting -->
  <text x="62" y="1320" class="section">5 · CROSS-CUTTING SAFEGUARDS &amp; OPTIONAL SERVICES</text>
  <rect x="62" y="1342" width="405" height="105" rx="14" class="card"/>
  <rect x="485" y="1342" width="405" height="105" rx="14" class="card teal"/>
  <rect x="908" y="1342" width="405" height="105" rx="14" class="card violet"/>
  <rect x="1331" y="1342" width="407" height="105" rx="14" class="card"/>
  <text x="84" y="1373" class="cardTitle">Upload &amp; network controls</text><text x="84" y="1400" class="small">Type/size guards · isolated temp jobs · TTL cleanup</text><text x="84" y="1422" class="small">SSRF defense · local-only mode · optional API token</text>
  <text x="507" y="1373" class="cardTitle">LLM is optional</text><text x="507" y="1400" class="small">Groq / Claude can explain findings or suggest queries.</text><text x="507" y="1422" class="small">Deterministic checks remain evidence; AI is advisory.</text>
  <text x="930" y="1373" class="cardTitle">Audit &amp; verification</text><text x="930" y="1400" class="small">PII-safe SHA-256 event chain; content hashes.</text><text x="930" y="1422" class="small">Unpassed verification blocks sanitized download.</text>
  <text x="1353" y="1373" class="cardTitle">Core modules</text><text x="1353" y="1400" class="small">shield/ contains API, extraction, detection, redaction,</text><text x="1353" y="1422" class="small">verification, discovery, ledger, and scanner logic.</text>

  <text x="64" y="1477" class="tiny">Repository map based on current source and README. PCA and legacy Streamlit are identified separately from the primary automated API flow.</text>
</svg>
