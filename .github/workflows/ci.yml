name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System tools (OCR + pdftotext)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Face models (sha256-pinned)
        run: bash scripts/get_models.sh
      - name: Full validation (pytest, ruff, web, extension, mock crawl)
        run: bash scripts/validate.sh
      - name: No secrets committed
        run: PYTHONPATH=. python -m shield.codescan scan . --engines secrets --no-ocr --format md
