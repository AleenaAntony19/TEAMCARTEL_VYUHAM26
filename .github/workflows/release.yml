name: Release

# Push a tag like v0.5.1 (must equal vscode/package.json "version").
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  engine:
    name: engine + VSIX (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-15  # macos-14 is retired on 2026-11-02
            target: darwin-arm64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches extension version
        run: |
          want="v$(node -p "require('./vscode/package.json').version")"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Engine deps (minimal)
        run: pip install -r requirements-engine.txt
      - name: Face models (sha256-pinned)
        run: bash scripts/get_models.sh
      - name: Bundle Tesseract (Windows only; other OSes use a system tesseract if present)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract -y --no-progress
          echo "SHIELD_TESSERACT_DIR=C:\\Program Files\\Tesseract-OCR" >> "$GITHUB_ENV"
      - name: Build engine
        run: python engine/build.py
      - name: Smoke-test engine (scan, llm helper/ssl, MCP)
        run: python scripts/smoke_engine.py dist/shield-engine
      - name: Package platform VSIX with engine
        working-directory: vscode
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck && npm test
          rm -rf engine && mkdir engine && cp -RL ../dist/shield-engine engine/  # -L: VSIX (zip) cannot hold symlinks
          npx vsce package --no-dependencies --target ${{ matrix.target }} -o ../shield-code-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: shield-code-${{ matrix.target }}.vsix
          if-no-files-found: error

  universal:
    name: universal VSIX (no engine; uses Python if set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - working-directory: vscode
        run: |
          npm ci --no-audit --no-fund
          npx vsce package --no-dependencies -o ../shield-code-universal.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-universal
          path: shield-code-universal.vsix

  release:
    needs: [engine, universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum *.vsix > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.vsix SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes \
            --title "Shield·Code $GITHUB_REF_NAME"

  publish:
    # Runs only when store tokens are configured (repo Settings > Secrets > Actions: OVSX_PAT, VSCE_PAT).
    needs: release
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Open VSX (Antigravity, Cursor, VSCodium)
        if: env.OVSX_PAT != ''
        # each target is its own upload; a rerun skips the ones already published
        run: |
          set -e
          for f in *.vsix; do npx --yes ovsx@0.10.6 publish "$f" -p "$OVSX_PAT" --skip-duplicate; done
      - name: Check the listing
        if: env.OVSX_PAT != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl -fsS "https://open-vsx.org/api/aaron43210/shield-code/$version" | jq -e --arg v "$version" '.version == $v'
      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: for f in *.vsix; do npx --yes @vscode/vsce@4.0.0 publish --packagePath "$f" -p "$VSCE_PAT"; done
